'use strict';
const QUESTIONS=[{"number":32,"question":"RBS 是？","options":{"A":"工作分解結構","B":"組織分解結構","C":"資訊分解結構","D":"風險分解結構"},"answer":"D","page":8},{"number":33,"question":"使用非線性風險衡量尺度的目的是為了？","options":{"A":"計算方便","B":"提高精確度","C":"凸顯高風險","D":"降低風險損失"},"answer":"C","page":8},{"number":34,"question":"專案的人力可以從何而來？","options":{"A":"內部借調","B":"外部招募","C":"外包","D":"以上皆是"},"answer":"D","page":8},{"number":35,"question":"人力負荷圖是？","options":{"A":"柏拉圖","B":"直方圖","C":"甘特圖","D":"要因圖"},"answer":"B","page":8},{"number":36,"question":"規劃合約時的專家諮詢通常是指？","options":{"A":"有經驗的專案經理","B":"有經驗的部門經理","C":"律師","D":"以上皆是"},"answer":"D","page":8},{"number":37,"question":"比較可以精確估計專案間接成本的方法是？","options":{"A":"類比法","B":"由下往上估計","C":"完成量估計法","D":"作業基礎成本制"},"answer":"D","page":9},{"number":38,"question":"下列順序何者正確?","options":{"A":"組合管理→大型專案→專案→子專案→工作包","B":"大型專案→組合管理→專案→子專案→工作包","C":"型態管理→大型專案→專案→子專案→工作包","D":"大型專案→型態管理→專案→子專案→工作包"},"answer":"A","page":9},{"number":39,"question":"下列順序何者正確？","options":{"A":"需求→目標→範圍","B":"目標→WBS→範圍","C":"需求→範圍→WBS","D":"目標→OBS→WBS"},"answer":"A","page":9},{"number":40,"question":"發生機率高但是衝擊小的風險應該如何處理？","options":{"A":"躲避風險","B":"降低風險","C":"轉移風險","D":"接受風險"},"answer":"B","page":9},{"number":41,"question":"研究專案產品的精密度，以決定執行的方法是在進行？","options":{"A":"品質規劃","B":"品質保證","C":"品質管制","D":"以上皆是"},"answer":"A","page":10},{"number":42,"question":"沒有技術問題的工作說明應該要？","options":{"A":"中等詳細到非常詳細","B":"粗略到中等詳細","C":"非常詳細","D":"以上皆是"},"answer":"B","page":10},{"number":43,"question":"有關工作說明(SOW)何者有錯？","options":{"A":"和合約有關的工作","B":"和外包有關的工作","C":"和高層有關的工作","D":"以上皆是"},"answer":"C","page":10},{"number":44,"question":"成本估計需要知道？","options":{"A":"資源可用性","B":"工作分解結構","C":"專案進度","D":"以上皆是"},"answer":"B","page":10},{"number":45,"question":"資源拉平的目的是為了？","options":{"A":"平衡資源的需求","B":"平衡資源的供給","C":"以上皆是","D":"以上皆非"},"answer":"A","page":10},{"number":46,"question":"範圍基準不包括?","options":{"A":"範圍說明","B":"WBS","C":"WBS 辭典","D":"SOW"},"answer":"D","page":11},{"number":47,"question":"談判時提醒對方自己要搭3 點的班機，這是什麼談判技巧？","options":{"A":"轉移話題","B":"時間期限","C":"授權有限","D":"合理化"},"answer":"B","page":11},{"number":48,"question":"促進專案的溝通何者錯誤？","options":{"A":"接收者關心溝通的訊息","B":"傳送者了解非口頭技巧的重要","C":"傳送者關心溝通的訊息","D":"以上皆非"},"answer":"C","page":11},{"number":49,"question":"工作授權系統的目的是？","options":{"A":"避免多做","B":"授權工作給個人","C":"授權工作給小組","D":"以上皆是"},"answer":"A","page":11},{"number":50,"question":"不開車改搭捷運，還會遲到的風險是？","options":{"A":"二次風險","B":"殘留風險","C":"次要風險","D":"以上皆是"},"answer":"B","page":12},{"number":51,"question":"不開車如果改搭捷運，反而發生事故的風險是？","options":{"A":"二次風險","B":"殘留風險","C":"次要風險","D":"以上皆是"},"answer":"A","page":12},{"number":52,"question":"專案的績效不是指？","options":{"A":"管理績效","B":"產品績效","C":"風險績效","D":"品質績效"},"answer":"C","page":12},{"number":53,"question":"專案應該定期預測？","options":{"A":"完工總預算","B":"完工總時間","C":"完工總成本","D":"完工總花費"},"answer":"C","page":12},{"number":54,"question":"有關專案的里程碑，何者正確？","options":{"A":"工期固定","B":"工期不固定","C":"沒有工期","D":"工期無限"},"answer":"C","page":12},{"number":55,"question":"你是大陸建廠專案的專案經理，供應商不能準時交貨是常態，這 是？","options":{"A":"專案所處的環境","B":"專案的主要風險","C":"專案超支的原因","D":"以上皆非"},"answer":"A","page":13},{"number":56,"question":"專案成員集中辦公的目的是為了？","options":{"A":"促進溝通","B":"團隊建立","C":"培養士氣","D":"以上皆非"},"answer":"B","page":13},{"number":57,"question":"林協理有權決定專案的預算，但是很忙，應該如何和他溝通？","options":{"A":"依照標準溝通程序處理","B":"被動提供專案相關訊息","C":"主動提供專案相關訊息","D":"以上皆非"},"answer":"C","page":13},{"number":58,"question":"柏拉圖原理是指？","options":{"A":"小部份問題來自大多數原因","B":"小部份原因造成大多數問題","C":"大部份問題來自大多數原因","D":"大部份原因造成大多數問題"},"answer":"B","page":13},{"number":59,"question":"專案控制階段發現品質小瑕疵，影響未知，專案經理應該？","options":{"A":"核准通過因為影響未知","B":"召開專案會議檢討原因","C":"向高層報告由他們決定","D":"以上皆是"},"answer":"B","page":14},{"number":60,"question":"何者最好使用正式書面溝通？","options":{"A":"授權書","B":"計劃書","C":"變更要求","D":"以上皆是"},"answer":"D","page":14},{"number":61,"question":"在大陸的專案人員與台灣的專案經理溝通應該儘量使用？","options":{"A":"正式書面","B":"正式口頭","C":"非正式書面","D":"非正式口頭"},"answer":"A","page":14},{"number":62,"question":"專案溝通模式不包括哪一個？","options":{"A":"發送者","B":"接收者","C":"媒介","D":"噪音"},"answer":"D","page":14},{"number":63,"question":"辦公室搬遷過程，不能影響客戶的服務品質，這是專案的？","options":{"A":"假設","B":"限制","C":"風險","D":"議題"},"answer":"B","page":14},{"number":64,"question":"360 度回饋是用在？","options":{"A":"績效評估","B":"問題解決","C":"議題處理","D":"以上皆是"},"answer":"A","page":15}];
const KEY='apma-offline-quiz-32-64-v1';
const AB='ABCD';
const byId=Object.fromEntries(QUESTIONS.map(q=>[q.number,q]));
const app=document.querySelector('#app');
const htmlEscape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={mode:'practice',random:false,session:null,showHome:false,history:[],wrongCounts:{}};
try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&typeof old==='object')state={...state,...old}}catch(e){}
let timerId=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function chooseMode(m){state.mode=m;save();render()}
function randomized(list){const a=list.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(mode=state.mode,subset=null){let ids=subset?subset.slice():QUESTIONS.map(q=>q.number);if(!ids.length)return;state.mode=mode;state.showHome=false;state.session={mode,ids:state.random?randomized(ids):ids,index:0,answers:{},submitted:false,recorded:false,started:Date.now(),ended:null};save();render();window.scrollTo(0,0)}
function answered(s){return s.ids.filter(n=>Object.prototype.hasOwnProperty.call(s.answers,n)).length}
function correctCount(s){return s.ids.filter(n=>s.answers[n]===byId[n].answer).length}
function formatTime(ms){let sec=Math.max(0,Math.floor(ms/1000));const h=Math.floor(sec/3600);const m=Math.floor(sec%3600/60);const s=sec%60;return [h,m,s].map(v=>String(v).padStart(2,'0')).join(':')}
function recordWrong(n){state.wrongCounts[n]=(state.wrongCounts[n]||0)+1}
function answer(choice){let s=state.session;if(!s||s.submitted)return;let n=s.ids[s.index];if(s.mode==='practice'&&s.answers[n])return;let before=s.answers[n];s.answers[n]=choice;if(s.mode==='practice'&&!before&&choice!==byId[n].answer)recordWrong(n);save();render()}
function move(delta){let s=state.session;if(!s)return;s.index=Math.max(0,Math.min(s.ids.length-1,s.index+delta));save();render();window.scrollTo({top:0,behavior:'smooth'})}
function jump(i){let s=state.session;if(!s)return;s.index=i;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function submitQuiz(){let s=state.session;if(!s||s.submitted)return;if(answered(s)!==s.ids.length){alert('還有 '+(s.ids.length-answered(s))+' 題尚未作答，請完成後再交卷。');return}finish()}
function finish(){let s=state.session;if(!s||s.submitted)return;s.submitted=true;s.ended=Date.now();if(s.mode==='exam')s.ids.forEach(n=>{if(s.answers[n]!==byId[n].answer)recordWrong(n)});if(!s.recorded){state.history.unshift({date:s.ended,score:correctCount(s),total:s.ids.length,mode:s.mode});state.history=state.history.slice(0,100);s.recorded=true}save();render();window.scrollTo(0,0)}
function leave(){if(!state.session)return;state.showHome=true;save();render();window.scrollTo(0,0)}
function discardAndStart(){if(state.session&&!state.session.submitted&&answered(state.session)>0&&!confirm('重新測驗會捨棄目前這次的答案，確定繼續？'))return;start()}
function clearAll(){if(!confirm('確定清除所有答題進度、歷史成績與錯題紀錄？此動作無法復原。'))return;state={mode:'practice',random:false,session:null,showHome:false,history:[],wrongCounts:{}};save();render()}
function retryWrong(){let s=state.session;if(!s)return;const ids=s.ids.filter(n=>s.answers[n]!==byId[n].answer);if(ids.length)start('practice',ids)}
function startSavedWrong(){const ids=QUESTIONS.map(q=>q.number).filter(n=>(state.wrongCounts[n]||0)>0);if(ids.length)start('practice',ids)}
function rootButton(text,klass,attrs=''){return `<button type="button" class="btn ${klass}" ${attrs}>${htmlEscape(text)}</button>`}
function renderHome(){const full=state.history.filter(x=>x.total===33),best=full.length?Math.max(...full.map(x=>x.score)):'—',wrong=Object.values(state.wrongCounts).filter(x=>x>0).length;let resumed=state.session&&!state.session.submitted;
return `<div class="card panel"><div class="eyebrow">考前自我檢測</div><h1 class="h1">33 題完整練習，對照 PDF 原始答案</h1><p class="sub">依照上傳試題逐題作答。正確答案取自原始 PDF 的紅色標示，考試期間不提前顯示。</p><div class="mode-grid"><button class="mode ${state.mode==='practice'?'active':''}" data-act="mode" data-val="practice"><strong>逐題練習</strong><span>選完就公布對錯與 PDF 正解，適合第一次複習。</span></button><button class="mode ${state.mode==='exam'?'active':''}" data-act="mode" data-val="exam"><strong>模擬考試</strong><span>33 題全部作答後交卷，一次計算成績及錯題。</span></button></div><div class="setup"><label class="switch"><input id="randomCheck" type="checkbox" ${state.random?'checked':''}> 題目隨機排序</label><span class="fine">每題只有一個正確選項</span></div>${rootButton('開始 '+(state.mode==='exam'?'模擬考試':'逐題練習'),'primary','data-act="start"')}${resumed?`<div style="margin-top:14px"><button class="btn" data-act="resume">繼續未完成測驗（${answered(state.session)}/${state.session.ids.length} 題）</button></div>`:''}<div class="stats"><div class="stat"><b>${full.length}</b><span>完整 33 題測驗次數</span></div><div class="stat"><b>${best}${best==='—'?'':' / 33'}</b><span>最佳成績</span></div><div class="stat"><b>${wrong}</b><span>曾經答錯題數</span></div></div><div class="section-head" style="margin-top:22px"><span class="fine">紀錄僅儲存於目前裝置／瀏覽器中；更換裝置不會同步。</span><div>${wrong?`<button class="btn small" data-act="savedwrong">複習歷史錯題</button> `:''}<button class="anchor-btn" data-act="clear">清除學習紀錄</button></div></div></div>`}
function renderQuiz(){const s=state.session;if(!s)return renderHome();if(s.submitted)return renderResult();const n=s.ids[s.index],q=byId[n],picked=s.answers[n],count=answered(s),isPractice=s.mode==='practice';const rightShown=!!(isPractice&&picked);
const options=AB.split('').map(a=>{let cls='option';if(picked===a)cls+=' selected';if(rightShown&&a===q.answer)cls+=' correct';if(rightShown&&picked===a&&a!==q.answer)cls+=' incorrect';if(rightShown)cls+=' locked';return `<button class="${cls}" data-act="answer" data-val="${a}" ${rightShown?'disabled':''} aria-pressed="${picked===a?'true':'false'}"><span class="letter">${a}</span><span>${htmlEscape(q.options[a])}</span></button>`}).join('');
const nav=s.ids.map((id,i)=>{let st='num';if(s.answers[id])st+=isPractice?(s.answers[id]===byId[id].answer?' right':' wrong'):' done';if(i===s.index)st+=' now';return `<button data-act="jump" data-index="${i}" class="${st}" aria-label="第 ${id} 題" title="第 ${id} 題">${id}</button>`}).join('');
const finishReady=count===s.ids.length;
return `<div class="quiz-layout"><section><div class="card panel"><div class="quiz-bar"><div class="meta"><span class="chip">${isPractice?'逐題練習':'模擬考試'}</span><span class="timer">第 ${s.index+1} / ${s.ids.length} 題　・　已作答 ${count} 題　<span data-timer> ${formatTime(Date.now()-s.started)}</span></span></div><div class="progress-bg"><div class="progress-bar" style="width:${count/s.ids.length*100}%"></div></div></div><div class="eyebrow">原始試題第 ${n} 題</div><h1 class="question-title">${htmlEscape(q.question)}</h1><div class="option-list">${options}</div>${rightShown?`<div class="feedback ${picked===q.answer?'good':'bad'}"><b>${picked===q.answer?'回答正確':'回答錯誤'}</b><div>PDF 紅字正解：<strong>${q.answer}. ${htmlEscape(q.options[q.answer])}</strong></div></div>`:''}<div class="nav-footer">${rootButton('上一題','','data-act="prev" '+(s.index===0?'disabled':''))}<div class="right-buttons">${s.index<s.ids.length-1?rootButton('下一題','primary','data-act="next"'):rootButton('回到第 32 題','','data-act="first"')}${rootButton(finishReady?'交卷並查看成績':'尚有 '+(s.ids.length-count)+' 題未作答',finishReady?'good':'','data-act="submit" '+(!finishReady?'disabled':''))}</div></div></div><p class="mode-note">${isPractice?'練習模式選定答案後立即核對，該題不可修改；作答錯誤會記錄在錯題本。':'模擬考模式可修改答案，直到全部 33 題完成並交卷才顯示正解。'}</p></section><aside class="card side"><div class="side-head"><strong>題目總覽</strong><button class="anchor-btn" data-act="home">返回首頁</button></div><div class="legend">點選題號快速跳題｜共 ${s.ids.length} 題</div><div class="grid-numbers">${nav}</div><div class="help">${isPractice?'綠色：答對；紅色：答錯；藍色：目前題目。':'淡藍色：已作答；深藍色：目前題目。'}</div></aside></div>`}
function renderResult(){const s=state.session,good=correctCount(s),wrong=s.ids.filter(n=>s.answers[n]!==byId[n].answer),percent=Math.round(good/s.ids.length*100);const reviews=s.ids.map(n=>{const q=byId[n],a=s.answers[n],ok=a===q.answer;return `<div class="reviewitem"><div class="reviewtitle">${ok?'✓':'✕'}　第 ${n} 題｜${htmlEscape(q.question)}</div><div class="reviewans">你的答案：<span class="${ok?'good':'bad'}">${a}. ${htmlEscape(q.options[a])}</span><br>PDF 正確答案：<span class="good">${q.answer}. ${htmlEscape(q.options[q.answer])}</span></div></div>`}).join('');
return `<div class="card panel"><div class="result-head"><div><div class="eyebrow">${s.mode==='exam'?'模擬考成績':'練習結果'} · ${s.ids.length} 題</div><h1 class="h1" style="margin-bottom:5px">已完成這次測驗</h1><div class="sub">答案已逐題比對 PDF 紅色標示；本次作答時間 ${formatTime(s.ended-s.started)}。</div></div><div class="big-score">${good} <span style="font-size:23px;color:#8492a6">/ ${s.ids.length}</span></div></div><div class="stats"><div class="stat"><b>${percent}%</b><span>正確率</span></div><div class="stat"><b style="color:var(--good)">${good}</b><span>答對</span></div><div class="stat"><b style="color:var(--bad)">${wrong.length}</b><span>答錯</span></div></div><div class="result-actions">${wrong.length?rootButton(`只重做錯題（${wrong.length} 題）`,'primary','data-act="retrywrong"'):''}${rootButton('重新挑戰 33 題','','data-act="restart"')}${rootButton('返回首頁','','data-act="home"')}</div><div class="review"><div class="section-head"><h2>逐題答案對照</h2><span class="fine">以下全部採用原檔紅字答案</span></div>${reviews}</div></div>`}
function render(){app.innerHTML=state.session&&!state.showHome?renderQuiz():renderHome();if(timerId)clearInterval(timerId);const el=app.querySelector('[data-timer]');if(el&&state.session&&!state.session.submitted)timerId=setInterval(()=>{const e=app.querySelector('[data-timer]');if(e&&state.session&&!state.session.submitted)e.textContent=' '+formatTime(Date.now()-state.session.started)},1000)}
app.addEventListener('click',e=>{let el=e.target.closest('[data-act]');if(!el)return;let act=el.dataset.act;if(act==='mode')chooseMode(el.dataset.val);else if(act==='start')discardAndStart();else if(act==='resume'){state.showHome=false;save();render()}else if(act==='answer')answer(el.dataset.val);else if(act==='next')move(1);else if(act==='prev')move(-1);else if(act==='jump')jump(+el.dataset.index);else if(act==='first')jump(0);else if(act==='submit')submitQuiz();else if(act==='home')leave();else if(act==='retrywrong')retryWrong();else if(act==='savedwrong')startSavedWrong();else if(act==='restart')start();else if(act==='clear')clearAll()});
app.addEventListener('change',e=>{if(e.target.id==='randomCheck'){state.random=e.target.checked;save()}});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||/input|textarea|select/i.test(document.activeElement?.tagName||''))return;if(!state.session||state.showHome||state.session.submitted)return;if('1234'.includes(e.key)){e.preventDefault();answer(AB[Number(e.key)-1])}else if(e.key==='ArrowRight'){move(1)}else if(e.key==='ArrowLeft'){move(-1)}});
render();
</script>
</body>
</html>
