const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function rng(){return (typeof crypto!=='undefined'&&crypto.getRandomValues)?crypto.getRandomValues(new Uint32Array(1))[0]/4294967296:Math.random()}
function shuffle(input){let out=[...input];for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function fmtTime(ms){let s=Math.max(0,Math.floor(ms/1000));return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')}
function fmtDate(ts){return new Date(ts).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})}
function answered(s){return s.ids.filter(n=>s.answers[n]!==undefined).length}
function rights(s){return s.ids.filter(n=>s.answers[n]===QMAP[n].answer).length}
function wrongs(s){return s.ids.filter(n=>s.answers[n]!==QMAP[n].answer)}

let choose=`<div class="subhead">本次練習題數</div><div class="sizes">${[20,40,118].map(n=>`<button class="sizebtn ${state.count===n?'on':''}" data-act="count" data-value="${n}" aria-pressed="${state.count===n}">${n===118?'全部 118 題':n+' 題'}</button>`).join('')}</div>`;
const entries=hist.slice(0,5).map(h=>`<div class="historyline"><span>${fmtDate(h.date)}<br><span class="tiny">${h.mode==='exam'?'模擬考':'逐題練習'} · ${h.total} 題</span></span><b>${h.correct}/${h.total}（${Math.round(h.correct/h.total*100)}%）</b></div>`).join('');
return `<div class="home-grid"><section class="card pad"><div class="row"><span class="tag">完整 118 題題庫</span><span class="tag">每回合重新洗牌</span></div><div class="eyebrow" style="margin-top:18px">PROJECT MANAGEMENT · FINAL REVIEW</div><h1>把 1～118 題打亂，真正測試自己會不會</h1><p class="muted">題目保留原 PDF 的題號和 A～D 選項，每次按下「開始新測驗」都會重新產生隨機順序，不會只照固定題號作答。</p>${modes}${choose}<div class="startrow">${btn('開始隨機 '+state.count+' 題','primary wide','data-act="start"')}${old?btn(`繼續上次測驗（${answered(state.session)}/${state.session.ids.length}）`,'','data-act="resume"'):''}</div><div class="hint" style="margin-top:23px">評分依原 PDF 紅字答案；沒有額外修改題意或替原題補充解釋。若只選 20 或 40 題，系統會從全部 118 題隨機抽出、不重複出題。</div></section><aside class="side-home"><section class="card pad"><h2>練習紀錄</h2><div class="score-metrics"><div class="metric"><b>${hist.length}</b><span>已完成測驗</span></div><div class="metric"><b>${best==='—'?'—':best+'/118'}</b><span>118 題最高分</span></div><div class="metric"><b>${wrong}</b><span>歷史錯題數</span></div><div class="metric"><b>${marked}</b><span>已標記題目</span></div></div><div class="history"><div class="subhead">最近測驗</div>${entries||'<p class="muted small">尚無成績紀錄。</p>'}</div></section><section class="mini-box"><strong>考前加強</strong><p class="muted">針對先前答錯或標記的題目，再做一次隨機練習。</p>${btn(`重練歷史錯題（${wrong}）`,'','data-act="wrongbank" '+(!wrong?'disabled':''))}${btn(`練習已標記題目（${marked}）`,'','data-act="marks" '+(!marked?'disabled':''))}<div style="margin-top:14px" class="fine">紀錄只保存在此瀏覽器；與之前分段練習網頁的紀錄不互通。</div><div style="margin-top:9px"><button class="plain small" data-act="clear">清除本頁學習紀錄</button></div></section></aside></div>`}
function renderOptions(q,s,id){let picked=s.answers[id];let seen=s.mode==='practice'&&picked!==undefined;return ALPHABET.map(k=>{let klass='option';if(picked===k)klass+=' picked';if(seen&&k===q.answer)klass+=' correct';if(seen&&k===picked&&picked!==q.answer)klass+=' wrong';return `<button class="${klass}" data-act="answer" data-value="${k}" ${seen?'disabled':''} aria-pressed="${picked===k}"><span class="letter">${k}</span><span>${escapeHTML(q.options[k])}</span></button>`}).join('')}
function renderQuiz(){const s=state.session; if(!s)return renderHome();if(s.submitted)return renderResults();const id=s.ids[s.index],q=QMAP[id],picked=s.answers[id],seen=s.mode==='practice'&&picked!==undefined;let nav=s.ids.map((n,i)=>{let cl='navitem';if(s.answers[n]!==undefined)cl+=s.mode==='practice'?(s.answers[n]===QMAP[n].answer?' right':' bad'):' answered';if(state.bookmarks[n])cl+=' flag';if(i===s.index)cl+=' active';return `<button class="${cl}" data-act="jump" data-value="${i}" title="本次第 ${i+1} 題／原題 ${n}" aria-label="跳至原題第 ${n} 題">${n}</button>`}).join('');let progress=answered(s)/s.ids.length*100;
return `<div class="quiz-layout"><section><div class="card pad"><div class="progress-line"><div class="row"><span class="tag">${s.mode==='exam'?'模擬考試':'逐題練習'}</span><span class="round-title">本回合第 ${s.index+1} / ${s.ids.length} 題</span></div><span class="clock">已答 ${answered(s)} 題　 <span data-clock>${fmtTime(Date.now()-s.started)}</span></span></div><div class="progress-track" role="progressbar" aria-valuenow="${Math.round(progress)}" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:${progress}%"></div></div><div class="question-row"><span class="qnum">PDF 原始第 ${id} 題 · 第 ${q.page} 頁</span><button class="bookmark ${state.bookmarks[id]?'on':''}" data-act="mark" aria-pressed="${!!state.bookmarks[id]}">${state.bookmarks[id]?'★ 已標記':'☆ 標記複習'}</button></div><h1 class="question">${escapeHTML(q.question)}</h1><div class="options">${renderOptions(q,s,id)}</div>${seen?`<div class="feedback ${picked===q.answer?'pass':'fail'}"><strong>${picked===q.answer?'答對了':'答錯了'}</strong>PDF 紅字解答：${q.answer}．${escapeHTML(q.options[q.answer])}</div>`:''}<div class="question-bottom">${btn('← 上一題','','data-act="prev" '+(s.index===0?'disabled':''))}<div class="buttons">${btn('下一個未答','','data-act="nextblank"')}${s.index===s.ids.length-1?btn('回第一題','','data-act="first"'):btn('下一題 →','primary','data-act="next"')}</div></div><div class="line" style="margin-top:25px;margin-bottom:18px"></div><div class="row between"><span class="muted small">${s.mode==='exam'?'交卷前可修改答案，正解不會提前顯示。':'作答後立即公布正解，單題不能修改。'}</span>${btn('交卷 / 看成績','good smallbtn','data-act="submit"')}</div></div></section><aside class="card sidebar"><div class="sidebar-head"><h2>題目導覽</h2><button class="plain small" data-act="home">返回首頁</button></div><p class="nav-note">格子顯示原始題號，排列順序就是本回合洗牌後的順序。</p><details class="collapse" open><summary>顯示 ${s.ids.length} 題（點此展開／收合）</summary><div class="navgrid">${nav}</div></details><div class="legend">${s.mode==='practice'?'綠色：答對；紅色：答錯。':'淡藍色：已作答。'}<br>深藍色：目前題目；底部黃色線條：已標記。</div><div class="line" style="margin:16px 0"></div><div class="row">${btn('跳到第一個未答','','data-act="nextblank"')}${btn('交卷','','data-act="submit"')}</div></aside></div>`}
function reviewItem(id,s){let q=QMAP[id],picked=s.answers[id];let good=picked===q.answer;return `<div class="reviewitem"><div><h3>第 ${id} 題｜${escapeHTML(q.question)}</h3><p>你的答案：<span class="${good?'answer-right':'answer-wrong'}">${picked===undefined?'未作答':picked+'．'+escapeHTML(q.options[picked])}</span></p><p>PDF 正解：<span class="answer-right">${q.answer}．${escapeHTML(q.options[q.answer])}</span></p><div class="tiny">PDF 第 ${q.page} 頁</div></div><div><span class="pill ${good?'pass':'fail'}">${good?'答對':'答錯或未答'}</span></div></div>`}
function renderResults(){const s=state.session,g=rights(s),w=wrongs(s),blank=s.ids.length-answered(s),p=Math.round(g/s.ids.length*100),filter=state.reviewFilter||'wrong';let ids=filter==='wrong'?w:filter==='right'?s.ids.filter(n=>s.answers[n]===QMAP[n].answer):s.ids;return `<div class="card pad"><div class="results-head"><div><div class="eyebrow">${s.mode==='exam'?'模擬考試':'逐題練習'} · ${s.ids.length} 題</div><h1>本次測驗已完成</h1><p class="muted">所有答案對照原 PDF 紅字解答 · 用時 ${fmtTime(s.ended-s.started)}</p></div><div class="scorebox"><div class="score">${g}<small> / ${s.ids.length}</small></div><div class="muted small">正確率 ${p}%</div></div></div><div class="resultmetrics"><div class="metric"><b>${p}%</b><span>正確率</span></div><div class="metric"><b style="color:var(--green)">${g}</b><span>答對</span></div><div class="metric"><b style="color:var(--red)">${w.length}</b><span>答錯含未答</span></div><div class="metric"><b>${blank}</b><span>未作答</span></div></div><div class="resultactions">${w.length?btn(`再練本次錯題（${w.length}）`,'primary','data-act="retry"'):''}${btn('重新洗牌再考一次','','data-act="restart"')}${btn('返回首頁','','data-act="home"')}</div><div class="line"></div><div class="row between"><h2>答案核對</h2><span class="fine">原始 PDF 第 1～118 題，題目未重新編號</span></div><div class="filters"><button class="filter ${filter==='wrong'?'on':''}" data-act="filter" data-value="wrong">答錯／未答 (${w.length})</button><button class="filter ${filter==='right'?'on':''}" data-act="filter" data-value="right">答對 (${g})</button><button class="filter ${filter==='all'?'on':''}" data-act="filter" data-value="all">全部 (${s.ids.length})</button></div><div>${ids.length?ids.map(n=>reviewItem(n,s)).join(''):'<div class="empty">這個篩選條件沒有題目。</div>'}</div></div>`}
function render(){app.innerHTML=state.showHome||!state.session?renderHome():renderQuiz();if(timer){clearInterval(timer);timer=null}const c=app.querySelector('[data-clock]');if(c&&state.session&&!state.session.submitted){timer=setInterval(()=>{let x=app.querySelector('[data-clock]');if(x&&state.session&&!state.session.submitted)x.textContent=fmtTime(Date.now()-state.session.started)},1000)}}
function jump(i){let s=state.session;if(!s)return;s.index=Math.max(0,Math.min(s.ids.length-1,i));save();render();window.scrollTo(0,0)}
function start(mode,subset){if(state.session&&!state.session.submitted&&answered(state.session)>0&&!confirm('目前有未完成的答題進度；開始新測驗會取代它。確定繼續？'))return;let ids=shuffle(subset||QUESTIONS.map(q=>q.number));if(!subset)ids=ids.slice(0,state.count);if(!ids.length)return;state.session={ids,index:0,answers:{},mode:mode||state.mode,started:Date.now(),submitted:false,recorded:false};state.showHome=false;state.reviewFilter='wrong';save();render();window.scrollTo(0,0)}
function answer(k){const s=state.session;if(!s||s.submitted)return;let id=s.ids[s.index];if(s.mode==='practice'&&s.answers[id]!==undefined)return;let was=s.answers[id];s.answers[id]=k;if(s.mode==='practice'&&was===undefined&&k!==QMAP[id].answer)state.wrongCounts[id]=(state.wrongCounts[id]||0)+1;save();render()}
function submit(){const s=state.session;if(!s||s.submitted)return;let empty=s.ids.length-answered(s);if(empty&&!confirm(`你還有 ${empty} 題沒有作答，未作答會算錯。確定現在交卷？`))return;s.submitted=true;s.ended=Date.now();if(s.mode==='exam')for(let id of wrongs(s))state.wrongCounts[id]=(state.wrongCounts[id]||0)+1;if(!s.recorded){state.history.unshift({date:s.ended,correct:rights(s),total:s.ids.length,mode:s.mode});state.history=state.history.slice(0,80);s.recorded=true}state.reviewFilter=wrongs(s).length?'wrong':'all';save();render();window.scrollTo(0,0)}
function retry(which){const s=state.session;let ids=which==='wrongbank'?QUESTIONS.filter(q=>state.wrongCounts[q.number]>0).map(q=>q.number):which==='marks'?QUESTIONS.filter(q=>state.bookmarks[q.number]).map(q=>q.number):(s?wrongs(s):[]);if(!ids.length)return;start('practice',ids)}
function goHome(){state.showHome=true;save();render();window.scrollTo(0,0)}
function firstBlank(){let s=state.session;if(!s)return;let i=s.ids.findIndex(n=>s.answers[n]===undefined);if(i<0){alert('本次測驗所有題目均已作答。');return}jump(i)}
function clearAll(){if(!confirm('確定刪除這份 118 題總複習的進度、錯題及成績？此動作無法復原。'))return;state=initial();save();render()}
app.addEventListener('click',e=>{const el=e.target.closest('button[data-act]');if(!el)return;const act=el.dataset.act,val=el.dataset.value;
if(act==='mode'){state.mode=val;save();render()}else if(act==='count'){state.count=Number(val);save();render()}else if(act==='start')start();else if(act==='resume'){state.showHome=false;save();render()}else if(act==='answer')answer(val);else if(act==='jump')jump(Number(val));else if(act==='next')jump(state.session.index+1);else if(act==='prev')jump(state.session.index-1);else if(act==='first')jump(0);else if(act==='nextblank')firstBlank();else if(act==='submit')submit();else if(act==='home')goHome();else if(act==='mark'){let id=state.session.ids[state.session.index];state.bookmarks[id]=!state.bookmarks[id];save();render()}else if(act==='filter'){state.reviewFilter=val;save();render()}else if(act==='retry')retry('retry');else if(act==='wrongbank')retry('wrongbank');else if(act==='marks')retry('marks');else if(act==='restart')start();else if(act==='clear')clearAll();});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))return;let s=state.session;if(state.showHome||!s||s.submitted)return;if('1234'.includes(e.key)){e.preventDefault();answer(ALPHABET[Number(e.key)-1])}else if(e.key==='ArrowRight'){e.preventDefault();jump(s.index+1)}else if(e.key==='ArrowLeft'){e.preventDefault();jump(s.index-1)}});
if(TOTAL!==118||QUESTIONS.some((q,i)=>q.number!==i+1||!ALPHABET.includes(q.answer)))throw Error('題庫不完整');
render();
</script>
