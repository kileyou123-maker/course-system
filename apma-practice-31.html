<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2939;--sub:#667085;--line:#e2e7ee;--accent:#265aa8;--accentlight:#eaf2ff;--good:#147d50;--goodbg:#eaf8ef;--bad:#c83e3e;--badbg:#fff0ef;--radius:15px;--shadow:0 10px 28px rgba(14,31,53,.055)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--bg)}body{font-size:16px;line-height:1.6}button{font:inherit;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,input:focus-visible{outline:3px solid #9ec2fc;outline-offset:3px}
.shell{max-width:1120px;margin:0 auto;padding:27px 23px 64px}.heading{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:4px 0 24px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:13px}.mark{background:var(--accent);height:43px;width:43px;border-radius:12px;color:white;display:grid;place-items:center;font-size:19px;font-weight:800;letter-spacing:-1px}.brand-title{font-size:22px;font-weight:800;letter-spacing:.01em}.brand-sub{font-size:13px;color:var(--sub)}.source{color:var(--sub);font-size:13px;text-align:right}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.panel{padding:32px}.eyebrow{font-size:13px;font-weight:750;color:var(--accent);letter-spacing:.05em}.h1{font-size:27px;line-height:1.35;margin:8px 0 12px;font-weight:800;letter-spacing:-.02em}.sub{color:var(--sub);margin:0}.callout{background:#f6f8fb;border:1px solid #e8edf4;color:#475467;border-radius:12px;padding:13px 16px;font-size:14px}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:25px 0 18px}.mode{background:white;border:2px solid var(--line);border-radius:13px;text-align:left;padding:19px;transition:.15s}.mode:hover{border-color:#8eb2e7}.mode.active{border-color:var(--accent);background:#f3f7ff}.mode strong{display:block;font-size:18px;margin-bottom:4px}.mode span{font-size:14px;color:var(--sub)}.setup{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0}.switch{display:flex;align-items:center;gap:9px;font-size:15px;cursor:pointer}.switch input{height:18px;width:18px;accent-color:var(--accent)}.btn{border-radius:10px;padding:12px 20px;border:1px solid var(--line);background:white;color:var(--ink);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;min-height:46px}.btn:hover:not(:disabled){background:#f7f9fd}.btn.primary{border-color:var(--accent);background:var(--accent);color:white}.btn.primary:hover:not(:disabled){background:#1b498d}.btn.good{background:var(--good);border-color:var(--good);color:white}.btn.ghost{background:none;border-color:transparent;color:var(--sub)}.btn.small{font-size:14px;padding:9px 13px;min-height:37px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}.stat{background:#fbfcfe;border:1px solid var(--line);border-radius:12px;padding:14px}.stat b{font-size:23px;display:block;line-height:1.3;font-variant-numeric:tabular-nums}.stat span{font-size:13px;color:var(--sub)}.fine{color:var(--sub);font-size:13px}.quiz-layout{display:grid;grid-template-columns:minmax(0,1fr) 286px;align-items:start;gap:20px}.quiz-bar{margin-bottom:16px}.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;border-radius:99px;padding:4px 10px;color:#375177;background:#eaf0f8;font-weight:700}.timer{font-variant-numeric:tabular-nums;font-size:14px;color:var(--sub)}.progress-bg{margin-top:12px;height:9px;background:#e8edf5;border-radius:10px;overflow:hidden}.progress-bar{height:100%;width:0;background:#316dbf;border-radius:inherit;transition:width .2s}.question-title{font-size:23px;font-weight:800;line-height:1.55;margin:11px 0 27px}.option-list{display:grid;gap:12px}.option{width:100%;display:flex;align-items:flex-start;gap:14px;border:1.5px solid var(--line);background:white;border-radius:12px;padding:17px 18px;text-align:left;line-height:1.6;font-size:16px;min-height:65px;transition:.12s}.option:hover:not(:disabled){background:#f8fbff;border-color:#91b4eb}.letter{flex:0 0 30px;height:30px;border:1px solid #dce3ed;display:grid;place-items:center;background:#f5f7fa;border-radius:9px;font-weight:800;color:#4d5e74;font-size:14px}.option.selected{border-color:var(--accent);background:#edf4ff}.option.selected .letter{background:var(--accent);border-color:var(--accent);color:white}.option.correct{background:var(--goodbg);border-color:#54ae81}.option.correct .letter{background:var(--good);border-color:var(--good);color:white}.option.incorrect{background:var(--badbg);border-color:#e28f87}.option.incorrect .letter{background:var(--bad);border-color:var(--bad);color:white}.option.locked{cursor:default;opacity:1}.feedback{margin-top:18px;border-radius:11px;padding:14px 16px;border:1px solid;font-size:15px}.feedback.good{background:var(--goodbg);border-color:#b6e3c8;color:#136641}.feedback.bad{background:var(--badbg);border-color:#f0c0bb;color:#982e2b}.feedback b{font-size:16px}.nav-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}.right-buttons{display:flex;gap:9px;flex-wrap:wrap}.side{position:sticky;top:20px;padding:20px}.side-head{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:10px}.side-head strong{font-size:17px}.grid-numbers{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:15px 0 20px}.num{border:1px solid #dbe2ec;background:white;color:#475467;border-radius:9px;height:38px;font-size:13px;font-weight:800}.num:hover{border-color:var(--accent)}.num.done{background:#eaf2ff;color:var(--accent);border-color:#b8d2fa}.num.now{background:var(--accent);color:#fff;border-color:var(--accent)}.num.right{background:#eaf8ef;color:var(--good);border-color:#a7dabc}.num.wrong{background:#fff0ef;color:var(--bad);border-color:#ecc1bd}.num.now{outline:2px solid #88b3f5;outline-offset:2px}.legend{font-size:13px;color:var(--sub);margin-bottom:13px}.help{font-size:13px;color:var(--sub);border-top:1px solid var(--line);padding-top:13px}.result-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:18px;align-items:center}.big-score{font-size:48px;line-height:1;font-weight:850;color:var(--accent);font-variant-numeric:tabular-nums}.review{margin-top:23px}.review h2{font-size:20px;margin:0 0 12px}.reviewitem{border-top:1px solid var(--line);padding:15px 0}.reviewtitle{font-weight:700}.reviewans{font-size:14px;color:#475467;margin-top:5px}.reviewans .bad{color:var(--bad);font-weight:700}.reviewans .good{color:var(--good);font-weight:700}.result-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.empty{padding:26px;color:var(--sub);text-align:center}.anchor-btn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:13px}.screenreader{position:absolute;left:-10000px}.footer{text-align:center;color:#8793a3;font-size:12px;margin-top:24px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.mode-note{font-size:13px;color:var(--sub);margin-top:13px}
@media(max-width:820px){.quiz-layout{grid-template-columns:1fr}.side{position:static;order:-1}.grid-numbers{grid-template-columns:repeat(8,minmax(0,1fr))}.shell{padding:19px 14px 50px}.panel{padding:23px}.question-title{font-size:21px}.source{text-align:left}.heading{gap:10px}.mode-grid{gap:9px}}
@media(max-width:520px){.brand-title{font-size:18px}.mark{height:38px;width:38px;font-size:17px}.h1{font-size:23px}.mode-grid{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:10px}.stat b{font-size:21px}.quiz-layout{gap:12px}.grid-numbers{grid-template-columns:repeat(8,1fr);gap:6px}.num{height:35px}.side{padding:14px}.panel{padding:19px}.question-title{font-size:20px}.option{padding:14px 12px;font-size:15px}.nav-footer .btn{flex:1}.right-buttons{width:100%;justify-content:space-between}.big-score{font-size:42px}}
@media print{body{background:white}.shell{max-width:none}.btn,.side,.footer{display:none}.card{box-shadow:none}}
</style>

<script>
'use strict';
const QUESTIONS=[{"number":1,"question":"有關專案的授權何者正確？","options":{"A":"公開口頭授權","B":"正式書面授權","C":"正式口頭配合非正式書面","D":"以上皆非"},"answer":"B","page":1},{"number":2,"question":"PDM 和 ADM 的差別？","options":{"A":"PDM 可表示一種順序關係","B":"ADM 可表示四種順序關係","C":"ADM 有虛活動","D":"PDM 沒有滯後關係"},"answer":"C","page":1},{"number":3,"question":"S 型曲線是指？","options":{"A":"專案的計劃值曲線","B":"專案的實際值曲線","C":"專案的掙值曲線","D":"以上皆非"},"answer":"A","page":1},{"number":4,"question":"人力資源規劃的關係人分析是希望了解？","options":{"A":"責任關係","B":"工作順序","C":"訓練需求","D":"以上皆非"},"answer":"A","page":1},{"number":5,"question":"二年的營建專案計劃書沒有分析天氣的影響，這是？","options":{"A":"假設沒有颱風","B":"颱風沒有影響","C":"接受颱風影響","D":"以上皆是"},"answer":"A","page":2},{"number":6,"question":"有關專案的說明，何者不正確？","options":{"A":"儘量使用專職人員","B":"儘量使用兼職人員","C":"可以完成專案的情況下，人員越少越好","D":"儘量使用技術能力高的人"},"answer":"B","page":2},{"number":7,"question":"專案團體公約是指？","options":{"A":"被鼓勵的行為","B":"被禁止的行為","C":"以上皆是","D":"以上皆非"},"answer":"C","page":2},{"number":8,"question":"如果匯率不變，專案成本估計要2 億，匯率不變是？","options":{"A":"假設","B":"限制","C":"估計的基礎","D":"以上皆非"},"answer":"C","page":2},{"number":9,"question":"決策樹分析主要用於？","options":{"A":"風險規劃","B":"定性風險分析","C":"定量風險分析","D":"風險因應"},"answer":"C","page":3},{"number":10,"question":"工作授權系統是？","options":{"A":"授權什麼事情何時做","B":"授權什麼事情由誰做","C":"授權誰在什麼時候做","D":"授權什麼事情如何做"},"answer":"A","page":3},{"number":11,"question":"為客戶設計建造遊艇，專利權歸誰？","options":{"A":"客戶","B":"造船廠","C":"依合約","D":"以上皆非"},"answer":"C","page":3},{"number":12,"question":"專案執行過程的績效審查是針對？","options":{"A":"每個專案成員","B":"每個工作包","C":"每個活動","D":"以上皆是"},"answer":"B","page":3},{"number":13,"question":"自由浮時是指？","options":{"A":"不影響專案完成的寬裕時間","B":"不影響後續活動最早開始的寬裕時間","C":"不影響前置活動最晚結束的寬裕時間","D":"以上皆非"},"answer":"B","page":3},{"number":14,"question":"一個工作包成本1500，完成三分之二花費1200，則成本偏差為？","options":{"A":"+300","B":"-300","C":"+200","D":"-200"},"answer":"D","page":4},{"number":15,"question":"專案的工作授權系統是使用於什麼階段？","options":{"A":"發起","B":"規劃","C":"執行","D":"控制"},"answer":"C","page":4},{"number":16,"question":"一般來說，隨著專案的進行，專案經理介入團隊的程度？","options":{"A":"越來越多","B":"越來越少","C":"早期多、中期少、後期多","D":"早期少、中期多、後期少"},"answer":"B","page":4},{"number":17,"question":"EV 小於 PV，但是大於 AC，代表？","options":{"A":"管理有問題","B":"進度有問題","C":"成本有問題","D":"預算有問題"},"answer":"B","page":4},{"number":18,"question":"專案成員人格特質不同所引起的專案衝突是？","options":{"A":"無益於專案的績效","B":"有害於專案的績效","C":"無害於專案的績效","D":"有益於專案的績效"},"answer":"D","page":5},{"number":19,"question":"計算最低成本(should cost)的目的是？","options":{"A":"檢驗廠商有無灌水","B":"檢驗供應商否了解 RFQ","C":"檢驗廠商是否了解 SOW","D":"以上皆是"},"answer":"D","page":5},{"number":20,"question":"以下的哪種情況發生時，特別需要監督風險？","options":{"A":"品質變更","B":"成本變更","C":"進度變更","D":"範圍變更"},"answer":"D","page":5},{"number":21,"question":"專案成員的績效問題最好以何種方法處理？","options":{"A":"正式書面","B":"正式口頭","C":"非正式書面","D":"非正式口頭"},"answer":"D","page":5},{"number":22,"question":"專案目標？","options":{"A":"不能變更","B":"可以變更","C":"硬性目標可以變更，軟性目標不能變更","D":"軟性目標可以變更，硬性目標不能變更"},"answer":"B","page":5},{"number":23,"question":"專案小組的績效問題最好以何種方法處理？","options":{"A":"正式書面","B":"正式口頭","C":"非正式書面","D":"非正式口頭"},"answer":"A","page":6},{"number":24,"question":"變更管制系統不包括？","options":{"A":"委員會","B":"程序","C":"表單","D":"測試"},"answer":"D","page":6},{"number":25,"question":"專案行政結束的主要目的是？","options":{"A":"評估專案績效","B":"評估人員績效","C":"留存經驗教訓","D":"以上皆是"},"answer":"C","page":6},{"number":26,"question":"專案授權書的主要目的是？","options":{"A":"人員管制","B":"責任指派","C":"促進溝通","D":"借調資源"},"answer":"D","page":6},{"number":27,"question":"專案經理的必備能力何者不包括？","options":{"A":"領導能力","B":"溝通能力","C":"談判能力","D":"說服能力"},"answer":"D","page":7},{"number":28,"question":"專案經理不需要的人格特質是？","options":{"A":"做事透明","B":"風趣","C":"敏銳","D":"忠誠"},"answer":"B","page":7},{"number":29,"question":"專案的經濟可行性分析要考慮？","options":{"A":"利率","B":"折舊","C":"通貨膨脹率","D":"以上皆是"},"answer":"D","page":7},{"number":30,"question":"何者不是限制理論所認為的人性上的現象？","options":{"A":"臨時抱佛腳","B":"高估活動工時","C":"低估活動工時","D":"提早完成不會報告"},"answer":"C","page":7},{"number":31,"question":"有關風險辨識何者正確？","options":{"A":"專案全程實施","B":"專案初期實施","C":"專案中期實施","D":"專案末期實施"},"answer":"A","page":7}];
const KEY='apma-offline-quiz-1-31-v1';
const AB='ABCD';
const byId=Object.fromEntries(QUESTIONS.map(q=>[q.number,q]));
const app=document.querySelector('#app');
const htmlEscape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={mode:'practice',random:false,session:null,showHome:false,history:[],wrongCounts:{}};
try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&typeof old==='object')state={...state,...old}}catch(e){}
let timerId=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function chooseMode(m){state.mode=m;save();render()}
function randomized(list){const a=list.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(mode=state.mode,subset=null){let ids=subset?subset.slice():QUESTIONS.map(q=>q.number);if(!ids.length)return;state.mode=mode;state.showHome=false;state.session={mode,ids:state.random?randomized(ids):ids,index:0,answers:{},submitted:false,recorded:false,started:Date.now(),ended:null};save();render();window.scrollTo(0,0)}
function answered(s){return s.ids.filter(n=>Object.prototype.hasOwnProperty.call(s.answers,n)).length}
function correctCount(s){return s.ids.filter(n=>s.answers[n]===byId[n].answer).length}
function formatTime(ms){let sec=Math.max(0,Math.floor(ms/1000));const h=Math.floor(sec/3600);const m=Math.floor(sec%3600/60);const s=sec%60;return [h,m,s].map(v=>String(v).padStart(2,'0')).join(':')}
function recordWrong(n){state.wrongCounts[n]=(state.wrongCounts[n]||0)+1}
function answer(choice){let s=state.session;if(!s||s.submitted)return;let n=s.ids[s.index];if(s.mode==='practice'&&s.answers[n])return;let before=s.answers[n];s.answers[n]=choice;if(s.mode==='practice'&&!before&&choice!==byId[n].answer)recordWrong(n);save();render()}
function move(delta){let s=state.session;if(!s)return;s.index=Math.max(0,Math.min(s.ids.length-1,s.index+delta));save();render();window.scrollTo({top:0,behavior:'smooth'})}
function jump(i){let s=state.session;if(!s)return;s.index=i;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function submitQuiz(){let s=state.session;if(!s||s.submitted)return;if(answered(s)!==s.ids.length){alert('還有 '+(s.ids.length-answered(s))+' 題尚未作答，請完成後再交卷。');return}finish()}
function finish(){let s=state.session;if(!s||s.submitted)return;s.submitted=true;s.ended=Date.now();if(s.mode==='exam')s.ids.forEach(n=>{if(s.answers[n]!==byId[n].answer)recordWrong(n)});if(!s.recorded){state.history.unshift({date:s.ended,score:correctCount(s),total:s.ids.length,mode:s.mode});state.history=state.history.slice(0,100);s.recorded=true}save();render();window.scrollTo(0,0)}
function leave(){if(!state.session)return;state.showHome=true;save();render();window.scrollTo(0,0)}
function discardAndStart(){if(state.session&&!state.session.submitted&&answered(state.session)>0&&!confirm('重新測驗會捨棄目前這次的答案，確定繼續？'))return;start()}
function clearAll(){if(!confirm('確定清除所有答題進度、歷史成績與錯題紀錄？此動作無法復原。'))return;state={mode:'practice',random:false,session:null,showHome:false,history:[],wrongCounts:{}};save();render()}
function retryWrong(){let s=state.session;if(!s)return;const ids=s.ids.filter(n=>s.answers[n]!==byId[n].answer);if(ids.length)start('practice',ids)}
function startSavedWrong(){const ids=QUESTIONS.map(q=>q.number).filter(n=>(state.wrongCounts[n]||0)>0);if(ids.length)start('practice',ids)}
function rootButton(text,klass,attrs=''){return `<button type="button" class="btn ${klass}" ${attrs}>${htmlEscape(text)}</button>`}
function renderHome(){const full=state.history.filter(x=>x.total===31),best=full.length?Math.max(...full.map(x=>x.score)):'—',wrong=Object.values(state.wrongCounts).filter(x=>x>0).length;let resumed=state.session&&!state.session.submitted;
return `<div class="card panel"><div class="eyebrow">考前自我檢測</div><h1 class="h1">31 題完整練習，對照 PDF 原始答案</h1><p class="sub">依照上傳試題逐題作答。正確答案取自原始 PDF 的紅色標示，考試期間不提前顯示。</p><div class="mode-grid"><button class="mode ${state.mode==='practice'?'active':''}" data-act="mode" data-val="practice"><strong>逐題練習</strong><span>選完就公布對錯與 PDF 正解，適合第一次複習。</span></button><button class="mode ${state.mode==='exam'?'active':''}" data-act="mode" data-val="exam"><strong>模擬考試</strong><span>31 題全部作答後交卷，一次計算成績及錯題。</span></button></div><div class="setup"><label class="switch"><input id="randomCheck" type="checkbox" ${state.random?'checked':''}> 題目隨機排序</label><span class="fine">每題只有一個正確選項</span></div>${rootButton('開始 '+(state.mode==='exam'?'模擬考試':'逐題練習'),'primary','data-act="start"')}${resumed?`<div style="margin-top:14px"><button class="btn" data-act="resume">繼續未完成測驗（${answered(state.session)}/${state.session.ids.length} 題）</button></div>`:''}<div class="stats"><div class="stat"><b>${full.length}</b><span>完整 31 題測驗次數</span></div><div class="stat"><b>${best}${best==='—'?'':' / 31'}</b><span>最佳成績</span></div><div class="stat"><b>${wrong}</b><span>曾經答錯題數</span></div></div><div class="section-head" style="margin-top:22px"><span class="fine">紀錄僅儲存於目前裝置／瀏覽器中；更換裝置不會同步。</span><div>${wrong?`<button class="btn small" data-act="savedwrong">複習歷史錯題</button> `:''}<button class="anchor-btn" data-act="clear">清除學習紀錄</button></div></div></div>`}
function renderQuiz(){const s=state.session;if(!s)return renderHome();if(s.submitted)return renderResult();const n=s.ids[s.index],q=byId[n],picked=s.answers[n],count=answered(s),isPractice=s.mode==='practice';const rightShown=!!(isPractice&&picked);
const options=AB.split('').map(a=>{let cls='option';if(picked===a)cls+=' selected';if(rightShown&&a===q.answer)cls+=' correct';if(rightShown&&picked===a&&a!==q.answer)cls+=' incorrect';if(rightShown)cls+=' locked';return `<button class="${cls}" data-act="answer" data-val="${a}" ${rightShown?'disabled':''} aria-pressed="${picked===a?'true':'false'}"><span class="letter">${a}</span><span>${htmlEscape(q.options[a])}</span></button>`}).join('');
const nav=s.ids.map((id,i)=>{let st='num';if(s.answers[id])st+=isPractice?(s.answers[id]===byId[id].answer?' right':' wrong'):' done';if(i===s.index)st+=' now';return `<button data-act="jump" data-index="${i}" class="${st}" aria-label="第 ${id} 題" title="第 ${id} 題">${id}</button>`}).join('');
const finishReady=count===s.ids.length;
return `<div class="quiz-layout"><section><div class="card panel"><div class="quiz-bar"><div class="meta"><span class="chip">${isPractice?'逐題練習':'模擬考試'}</span><span class="timer">第 ${s.index+1} / ${s.ids.length} 題　・　已作答 ${count} 題　<span data-timer> ${formatTime(Date.now()-s.started)}</span></span></div><div class="progress-bg"><div class="progress-bar" style="width:${count/s.ids.length*100}%"></div></div></div><div class="eyebrow">原始試題第 ${n} 題</div><h1 class="question-title">${htmlEscape(q.question)}</h1><div class="option-list">${options}</div>${rightShown?`<div class="feedback ${picked===q.answer?'good':'bad'}"><b>${picked===q.answer?'回答正確':'回答錯誤'}</b><div>PDF 紅字正解：<strong>${q.answer}. ${htmlEscape(q.options[q.answer])}</strong></div></div>`:''}<div class="nav-footer">${rootButton('上一題','','data-act="prev" '+(s.index===0?'disabled':''))}<div class="right-buttons">${s.index<s.ids.length-1?rootButton('下一題','primary','data-act="next"'):rootButton('回到第 1 題','','data-act="first"')}${rootButton(finishReady?'交卷並查看成績':'尚有 '+(s.ids.length-count)+' 題未作答',finishReady?'good':'','data-act="submit" '+(!finishReady?'disabled':''))}</div></div></div><p class="mode-note">${isPractice?'練習模式選定答案後立即核對，該題不可修改；作答錯誤會記錄在錯題本。':'模擬考模式可修改答案，直到全部 31 題完成並交卷才顯示正解。'}</p></section><aside class="card side"><div class="side-head"><strong>題目總覽</strong><button class="anchor-btn" data-act="home">返回首頁</button></div><div class="legend">點選題號快速跳題｜共 ${s.ids.length} 題</div><div class="grid-numbers">${nav}</div><div class="help">${isPractice?'綠色：答對；紅色：答錯；藍色：目前題目。':'淡藍色：已作答；深藍色：目前題目。'}</div></aside></div>`}
function renderResult(){const s=state.session,good=correctCount(s),wrong=s.ids.filter(n=>s.answers[n]!==byId[n].answer),percent=Math.round(good/s.ids.length*100);const reviews=s.ids.map(n=>{const q=byId[n],a=s.answers[n],ok=a===q.answer;return `<div class="reviewitem"><div class="reviewtitle">${ok?'✓':'✕'}　第 ${n} 題｜${htmlEscape(q.question)}</div><div class="reviewans">你的答案：<span class="${ok?'good':'bad'}">${a}. ${htmlEscape(q.options[a])}</span><br>PDF 正確答案：<span class="good">${q.answer}. ${htmlEscape(q.options[q.answer])}</span></div></div>`}).join('');
return `<div class="card panel"><div class="result-head"><div><div class="eyebrow">${s.mode==='exam'?'模擬考成績':'練習結果'} · ${s.ids.length} 題</div><h1 class="h1" style="margin-bottom:5px">已完成這次測驗</h1><div class="sub">答案已逐題比對 PDF 紅色標示；本次作答時間 ${formatTime(s.ended-s.started)}。</div></div><div class="big-score">${good} <span style="font-size:23px;color:#8492a6">/ ${s.ids.length}</span></div></div><div class="stats"><div class="stat"><b>${percent}%</b><span>正確率</span></div><div class="stat"><b style="color:var(--good)">${good}</b><span>答對</span></div><div class="stat"><b style="color:var(--bad)">${wrong.length}</b><span>答錯</span></div></div><div class="result-actions">${wrong.length?rootButton(`只重做錯題（${wrong.length} 題）`,'primary','data-act="retrywrong"'):''}${rootButton('重新挑戰 31 題','','data-act="restart"')}${rootButton('返回首頁','','data-act="home"')}</div><div class="review"><div class="section-head"><h2>逐題答案對照</h2><span class="fine">以下全部採用原檔紅字答案</span></div>${reviews}</div></div>`}
function render(){app.innerHTML=state.session&&!state.showHome?renderQuiz():renderHome();if(timerId)clearInterval(timerId);const el=app.querySelector('[data-timer]');if(el&&state.session&&!state.session.submitted)timerId=setInterval(()=>{const e=app.querySelector('[data-timer]');if(e&&state.session&&!state.session.submitted)e.textContent=' '+formatTime(Date.now()-state.session.started)},1000)}
app.addEventListener('click',e=>{let el=e.target.closest('[data-act]');if(!el)return;let act=el.dataset.act;if(act==='mode')chooseMode(el.dataset.val);else if(act==='start')discardAndStart();else if(act==='resume'){state.showHome=false;save();render()}else if(act==='answer')answer(el.dataset.val);else if(act==='next')move(1);else if(act==='prev')move(-1);else if(act==='jump')jump(+el.dataset.index);else if(act==='first')jump(0);else if(act==='submit')submitQuiz();else if(act==='home')leave();else if(act==='retrywrong')retryWrong();else if(act==='savedwrong')startSavedWrong();else if(act==='restart')start();else if(act==='clear')clearAll()});
app.addEventListener('change',e=>{if(e.target.id==='randomCheck'){state.random=e.target.checked;save()}});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||/input|textarea|select/i.test(document.activeElement?.tagName||''))return;if(!state.session||state.showHome||state.session.submitted)return;if('1234'.includes(e.key)){e.preventDefault();answer(AB[Number(e.key)-1])}else if(e.key==='ArrowRight'){move(1)}else if(e.key==='ArrowLeft'){move(-1)}});
render();
</script>
</body>
</html>
